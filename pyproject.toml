[project]
license = "MIT"
license-files = ["LICENSE"]
name = "rhiza-task"
version = "1.0.0"
description = "The rhiza developer tasks as a pinned CLI: one set of task names across Python, Rust and Go, replacing a synced make layer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jebel Quant Research" }]
keywords = ["rhiza", "task-runner", "make", "uv", "ci"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Three runtime dependencies, held down for the reason pytest-rhiza holds its four down:
# this package is provisioned by `uvx` on every gate invocation in CI, so its resolve time
# is paid per job. Everything a *task* needs -- pytest, ty, bandit, interrogate, mutmut,
# zensical, prek -- is provisioned by the task itself through `uv run --with` / `uvx`,
# exactly as the make recipes did, and so is deliberately absent here. tomllib is stdlib
# from 3.11, which is why there is no tomli.
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
# The script name matches the distribution name so that `uvx rhiza-task <task>` needs no
# `--from`. Worth stating, because it is the whole ergonomic argument for the package name.
rhiza-task = "rhiza_task.cli:main"

[project.entry-points."rhiza_task.tasks"]
# Task modules are discovered through this group rather than imported from a hardcoded
# list, which is what lets a downstream project add a task without a fork -- the
# replacement for `-include local.mk`. The built-ins register themselves the same way, so
# there is one mechanism rather than a built-in path and a plugin path.
python = "rhiza_task.tasks.python"
rust = "rhiza_task.tasks.rust"
go = "rhiza_task.tasks.go"
quality = "rhiza_task.tasks.quality"
extras = "rhiza_task.tasks.extras"
book = "rhiza_task.tasks.book"
doctor = "rhiza_task.tasks.doctor"
# The five bundle-owned fragments `.rhiza/make.d/` kept because nothing here answered for
# their targets. One module per bundle, so which bundle owns a task stays as legible as it
# was when each was a file the template synced.
github = "rhiza_task.tasks.github"
docker = "rhiza_task.tasks.docker"
lfs = "rhiza_task.tasks.lfs"
paper = "rhiza_task.tasks.paper"
presentation = "rhiza_task.tasks.presentation"

[project.urls]
Homepage = "https://github.com/jebel-quant/rhiza-task"
Repository = "https://github.com/jebel-quant/rhiza-task"
Issues = "https://github.com/jebel-quant/rhiza-task/issues"

[dependency-groups]
# hypothesis is declared here rather than left to `rhiza-task hypothesis-test`'s own
# `--with`, so that the property tests in tests/test_properties.py are collected by every
# runner and not only by that gate. `all` does not depend on hypothesis-test, so without
# this line CI would never execute them: ci.yml's matrix job syncs `--group test` and the
# `gates` job's `uv sync --all-extras --all-groups` picks it up too.
#
# The floor is what ci.yml's `lowest-deps` job installs, so it has to be a version that
# works with `pytest>=8.0` resolved to 8.0.0 on Python 3.11. 6.98 is the first that does.
test = ["pytest>=8.0", "pytest-cov>=6.0", "hypothesis>=6.98"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhiza_task"]

[tool.bumpversion]
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "src/rhiza_task/__init__.py"

# The README pins the CLI in its usage examples. Without this entry those examples drift:
# they still read `rhiza-task@0.1.0` two releases after 0.1.0.
[[tool.bumpversion.files]]
filename = "README.md"
search = "rhiza-task@{current_version}"
replace = "rhiza-task@{new_version}"

# The lockfile records this package's own version, and `uv lock --check` is the first
# command `install` runs -- so a bump that leaves uv.lock behind fails every gate that
# names `install` as a prerequisite, which is all of them. v1.0.0 shipped that way: the
# release commit touched pyproject.toml, __init__.py and CHANGELOG.md only. The search is
# anchored on the package name because a bare `version = "..."` matches every one of the
# seventeen locked packages.
[[tool.bumpversion.files]]
filename = "uv.lock"
search = """name = "rhiza-task"
version = "{current_version}\""""
replace = """name = "rhiza-task"
version = "{new_version}\""""

[tool.deptry.package_module_name_map]
# python-dotenv installs a module called `dotenv`. deptry runs isolated via `uvx`, so the
# package is not importable and it cannot discover the mapping itself -- it guesses
# `python_dotenv` and then reports the dependency as both unused (DEP002) and missing
# (DEP001). Declaring it is the documented fix, and cheaper than making the gate install
# the project first.
python-dotenv = "dotenv"

# This repository's own settings, read by `rhiza-task` as layer 4 of its own resolution
# order -- the package configuring itself with the mechanism it sells.
#
# The floor is 100, not the shipped default of 90 and no longer the 95 it passed through:
# the suite now covers all 1080 statements in `src/`, and a floor below what the suite
# already achieves is a ratchet that never catches anything. At 100 a new branch arrives
# with the test that exercises it or the gate goes red. It is enforced wherever `test`
# runs -- the `gates` job's `rhiza-task all` in CI, and every local invocation -- which is
# what makes it a gate rather than a note.
#
# What 100 does *not* claim is that every line is meaningfully asserted -- only that none
# is unvisited. Two lines stay excluded by `# pragma: no cover`, each carrying its reason:
# the TYPE_CHECKING guard in spec.py and the `__main__` delegation. Both are structural --
# unreachable under test by construction rather than merely awkward to reach -- so every
# exclusion left is one no test could retire, and a third would need that argument made.
[tool.rhiza-task]
coverage_fail_under = 100

# `ty` is already the shipped default (`typechecker` in config.py), so this line changes
# nothing today. It is here because *this* package owns that default: a future release
# that flipped it to `mypy` or `both` would change how this repository is typechecked
# without a commit touching this repository, and the dogfood `all` in CI is where that
# would land first and read as unrelated. Pinning it makes the choice this repo's own.
#
# The value is `both` because the second resolve paid for itself. `ty` alone was the
# setting here first -- it is Astral's, like `uv` and `ruff` which every gate already
# provisions -- and the note in its place said adding `mypy --strict` was the reasonable
# other answer whenever the extra signal proved worth it. It was: run against the project's
# own environment, `mypy --strict` found `Config.path` returning `Any` from a function
# declared `-> Path`, because `getattr` is typed `Any` and `ty` does not report the widening.
# One real finding in twenty modules is a low yield and exactly the kind `ty` is still young
# enough to miss, so the pair stays until `ty` grows the check.
#
# Worth knowing before reading a failure here: run `mypy --strict src` through `uvx`, with
# no project environment, and it reports ten errors rather than none -- four unresolvable
# imports and five untyped Typer decorators that follow from them. Those are artefacts of
# the invocation, not of the source. The task runs it under `uv run`, where the
# dependencies are present and the count is zero.
typechecker = "both"

# The suite is organised by *behaviour*, not as a 1:1 mirror of `src/`: `test_tasks.py`,
# `test_bundle_tasks.py`, `test_dev_tasks.py` and `test_language_layers.py` cover the
# twelve task modules as groups, because what is worth asserting about them is the shape
# they share -- a guard, a provision, an argument vector -- and a per-module test file
# would be twelve copies of one test. Undeclared, `check_test_layout.py` reads that as 18
# missing mirrors and 9 orphans, and reports disorder where there is a decision.
#
# `enforce = false` requires a non-empty `reason` precisely so the opt-out cannot be a
# silent one. The reason used to stop short of claiming per-module coverage, because only a
# 100 floor would guarantee it and this repo's was 95. The floor is 100 now (see above), so
# the stronger claim is available and the reason makes it: there is no module a missing
# test file could leave unexercised, because an unexercised module would put the total
# below the floor.
#
# The reason spells that floor "100" and never "100%": radon reads *every* `[tool.*]` table
# through configparser, which treats `%` as interpolation syntax and dies on any value
# containing one -- so a percent sign anywhere in this string breaks `radon cc src`, the
# command the complexity notes in spec.py, runner.py and config.py are there to answer.
# The constraint outlives the number, so it is stated as a rule rather than about one
# value: whatever the floor becomes, write it bare in here.
[tool.check_test_layout]
enforce = false
reason = "Tests are grouped by behaviour, not mirrored 1:1 -- the twelve task modules share one shape and are covered as groups. Per-module coverage is guaranteed instead by the coverage_fail_under floor of 100 in [tool.rhiza-task]: at that floor no module a missing test file would have covered can go unexercised."
