# Adapted from jebel-quant/rhiza's rhiza_weekly.yml (v1.4.2) rather than delegated to it
# as a stub. The reusable workflow runs its gates as `uvx "$RHIZA_TASK" <gate>` with
# RHIZA_TASK pinned to rhiza-task@0.3.1 -- correct for a consumer, circular here: this
# repository's own gates would run through a published, pre-1.0 copy of itself instead of
# the working tree. So the two jobs worth having are lifted and the indirection dropped.
#
# Its third job, semgrep, is not lifted: `rhiza-task semgrep` skips without
# .rhiza/semgrep.yml and this repository ships none, exactly as pytest-rhiza does not.
#
# Two more jobs here are local rather than lifted, so the count does not reconcile with
# upstream's: `advisories` and `link-check`. Both exist because nothing else asks their
# question -- see each one's own comment.

name: Weekly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  # The complement of ci.yml's `lowest-deps`: that job pins the floors the manifest
  # declares, this one resolves the ceiling nobody has seen yet. Between them, both ends
  # of `typer>=0.15` are actually tested -- and a break here is upstream's release, not a
  # commit, which is why it runs on a schedule rather than on push.
  dep-compat:
    name: latest compatible dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      # --upgrade ignores the committed lockfile and resolves the newest versions that
      # still satisfy pyproject.toml. Deliberately not --frozen, for the same reason
      # `lowest-deps` is not.
      - name: Resolve the newest compatible dependencies
        run: uv sync --all-extras --all-groups --upgrade

      - name: Show what that resolved to
        run: uv pip list

      # `uv run`, not `uvx rhiza-task@<pin>`: the point is to test HEAD against tomorrow's
      # dependencies, so the CLI under test has to be the one in the tree.
      - name: Run the gates
        run: uv run rhiza-task test

  # `rhiza-task security` is bandit, which is SAST: it lints the source this repository owns
  # and never looks at what is installed. So nothing asked the *dependency* question, and
  # tasks/python.py's `security` docstring explains at length why the answer is not to add
  # pip-audit to that task -- doing so would put a gate in consumers' CI that the template
  # they also follow says is not there. That argument is about the *shipped task*. It says
  # nothing about this repository scanning its own lockfile in its own workflow, which is
  # what this job does: no consumer inherits it, and no published gate changes.
  #
  # Weekly, and for the reason link-check below is weekly rather than the reason mutation is:
  # an advisory published on Tuesday is not the Tuesday author's fault, so gating a pull
  # request on it would fail builds for something the author cannot fix. A scheduled run is a
  # notification instead.
  #
  # Deliberately *not* continue-on-error, unlike mutation. A surviving mutant is a prompt to
  # write an assertion; a published advisory against a pinned dependency is a fact that wants
  # someone to look. Red is the whole signal, and it blocks nothing. If an advisory ever lands
  # with no fixed version available, the escape hatch is `--ignore-vuln <ID>` carrying its
  # reason on the line above -- not continue-on-error, which would silence every future one
  # too.
  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      # The committed lockfile is the subject, so `--frozen`: resolving afresh would scan
      # versions this repository has not pinned and miss the ones it has. `--all-extras
      # --all-groups` because a vulnerable test-only dependency still executes in CI, and
      # `--no-emit-project` drops rhiza-task itself, which is the thing being audited rather
      # than an input to the audit.
      - name: Export the locked dependency set
        run: >
          uv export --frozen --all-extras --all-groups --no-emit-project
          --format requirements-txt -o requirements.txt

      # `uvx`, not a dependency: this is the only place pip-audit is used, and provisioning it
      # per run keeps it out of the manifest that `lowest-deps` has to resolve.
      - name: Audit them against the advisory database
        run: uvx pip-audit -r requirements.txt

  # The complement of the 100 coverage floor, which pyproject.toml is careful to say does
  # not claim what it looks like it claims: at 100 no statement is *unvisited*, and nothing
  # asserts that any of them is meaningfully *asserted*. A floor that the suite already
  # reaches cannot ratchet further, so mutation score is the only signal left on assertion
  # quality -- and `mutation` was a registered, guarded, fully implemented gate that no
  # workflow invoked.
  #
  # Weekly rather than per-PR, and non-blocking, for two reasons that pull the same way:
  # mutmut re-runs the suite once per mutant, and a surviving mutant is a prompt to write an
  # assertion rather than a reason to hold a PR. `mutation` is not a prerequisite of `all`
  # either, so nothing else picks it up.
  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    # Non-blocking on purpose: this reports, it does not gate. Remove this line to make a
    # surviving mutant fail the run, and expect to write assertions before it is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      # `uv run`, not `uvx rhiza-task@<pin>`, for the reason the job above gives: the CLI
      # under test has to be the one in the tree.
      - name: Run mutmut
        run: uv run rhiza-task mutation

      # The task moves mutmut's HTML report to _tests/mutation/html and reports the run's
      # remembered status, so the report exists precisely when mutants survived -- which is
      # when it is worth reading. `always()` because a red step is the interesting case.
      - name: Upload the mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: _tests/mutation
          if-no-files-found: ignore

  # The README carries six badges and a dozen links -- to PyPI, to sibling repos, to the
  # uv and Ruff endpoints -- and docs/ adds eleven files of prose linking outward again.
  # Nothing else notices when one of them rots.
  #
  # This is the *network* half, and it stays weekly on purpose: an external link that 404s
  # is somebody else's deploy, and gating a pull request on it would fail builds for a
  # reason the author cannot fix. ci.yml's `links` job is the half that can be gated --
  # `--offline`, so it is deterministic -- and between them every link is covered by one or
  # the other. See that job's comment for the division.
  #
  # Note what this job could *not* have caught pre-merge: the README's link to
  # jebel-quant.github.io resolves against the *published* site, which lags a pull request
  # by definition, so a page added in a PR is legitimately 404 until deploy. That class is
  # `rhiza-task book-nav`'s, in rhiza_book.yml, not a link checker's.
  link-check:
    name: README and docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links in README.md and docs/
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            --max-retries 3
            README.md
            CONTRIBUTING.md
            'docs/**/*.md'
          fail: true
