# Adapted from jebel-quant/rhiza's rhiza_book.yml rather than delegated to it as a stub,
# for the reason weekly.yml gives: the reusable workflow runs its gate as
# `uvx "$RHIZA_TASK" book` with RHIZA_TASK pinned to rhiza-task@0.3.1 -- correct for a
# consumer, circular here, because this repository's own book would then be built by a
# published, pre-1.0 copy of itself instead of the working tree. So the two jobs are lifted
# and the indirection dropped: `uv run rhiza-task book` builds with the CLI under test.
#
# Two steps of the upstream job are also dropped rather than carried:
#
#   * `configure-git-auth` and `UV_EXTRA_INDEX_URL` -- this package has three public
#     runtime dependencies and no private index, so the secrets they need do not exist
#     here. ci.yml uses no secrets either.
#   * `lfs: true` on checkout -- nothing in this repository is tracked by git-lfs.
#
# Workflow: Book
# Purpose: Build the documentation site -- API reference, test and coverage reports, and
#          any Marimo notebooks -- and publish it to GitHub Pages.
#
# Trigger: Every push, on any branch, so every commit validates that the book still
#          builds. The deploy job publishes only from the default branch and never from a
#          fork; other branches build and upload an artifact.

name: "(RHIZA) BOOK"

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Builds on every commit and publishes nothing. It deliberately declares no environment,
  # so it stays runnable on every branch even when the github-pages environment restricts
  # deployments to one branch.
  build:
    name: build the book
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same action SHA and the same uv version as ci.yml, deliberately: a book that
      # builds on one uv and gates that pass on another is a resolver difference nothing
      # would catch.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Cache the MkDocs plugin cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/plugin/
          key: mkdocs-plugin-${{ runner.os }}-${{ hashFiles('mkdocs.yml', 'docs/mkdocs-base.yml', 'uv.lock', 'pyproject.toml') }}
          restore-keys: |
            mkdocs-plugin-${{ runner.os }}-

      # The paper engine, and only on the ref `deploy` will publish. `book` names `paper` as a
      # prerequisite and a *skipped* prerequisite does not block a dependent, so without an
      # engine this job built a site whose `Paper: paper/paper.pdf` nav entry pointed at a
      # file nothing had written -- and published it. That is what 404ed:
      # https://jebel-quant.github.io/rhiza-task/paper/paper.pdf, on a run that was green,
      # because every gate here passes when the paper is absent.
      #
      # Scoped to the default branch rather than run everywhere because the install is the
      # expensive half and a branch book is downloaded from the run page, not visited. A
      # branch build therefore still carries the dangling entry; the condition mirrors
      # `deploy`'s exactly, so the ref that publishes is the ref that has the engine. (The
      # fork exclusion is the job's own `if`, so it is not repeated here.)
      #
      # One tool where this used to be a distribution and a four-package list, and that is the
      # point of tectonic rather than a saving: the list asked each workflow to name the TeX
      # packages the document happens to cite, and two workflows compiling one document
      # against different package sets is a divergence neither would catch. tectonic resolves
      # what the document cites from its own bundle. The local action is shared with
      # rhiza_paper.yml so the engine version cannot diverge either, which matters because
      # that workflow publishes the same document's PDF on the `paper` branch.
      - name: Set up tectonic (publishing refs only)
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        uses: ./.github/actions/setup-tectonic

      # `book` depends on `test`, so this step also produces the `_tests/` tree it folds in
      # as docs/reports -- the coverage XML the badge step reads, and the HTML report and
      # coverage pages mkdocs.yml lists under Reports.
      - name: Build the book
        timeout-minutes: 20
        run: |
          START=$(date +%s)
          uv run rhiza-task book
          echo "Docs build: $(($(date +%s) - START))s" >> "$GITHUB_STEP_SUMMARY"

      # The gate on what was *published* rather than on what was built. zensical reports
      # `No issues found` for a nav entry whose page is missing and for one whose asset is
      # missing, so the engine install above fixes one instance of the 404 and this catches
      # the class: any nav target that did not make it into `_book/`.
      #
      # Same condition as the install above and as `deploy`, for a reason that is the whole
      # design of the gate: several nav entries here resolve only once the gates that produce
      # them have run -- the two `reports/` pages need a `_tests/` tree, the paper needs
      # tectonic -- so on a branch a dangling entry is the machine's shape, and on the ref
      # that publishes it is a defect. `book-nav` is deliberately not a prerequisite of
      # `book` for the same reason; a test in tests/test_tasks.py holds that.
      - name: Check every nav entry resolves (publishing refs only)
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        run: uv run rhiza-task book-nav

      # Downloadable from the run page, so a reviewer can open the built book for a branch
      # that will never be published.
      - name: Upload the book as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book
          path: _book/
          retention-days: 30

      - name: Upload the book as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _book/

  # Publishes only from the default branch, and never from a fork. The github-pages
  # environment is referenced here rather than in `build` so that the build stays runnable
  # on every branch.
  deploy:
    name: publish to GitHub Pages
    needs: build
    if: ${{ github.ref_name == github.event.repository.default_branch && !github.event.repository.fork }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write        # deploy to Pages
      id-token: write     # verify the deployment origin

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        continue-on-error: true
