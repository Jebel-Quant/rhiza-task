# Adapted from jebel-quant/rhiza's rhiza_paper.yml. Unlike the book workflow this one
# carries no circularity to remove -- upstream's version never calls rhiza-task at all, it
# reimplements the recipe in shell. Two things change as a result:
#
#   * The compile step calls `uv run rhiza-task paper` instead of inlining the engine, so
#     the workflow and a local `rhiza-task paper` cannot drift. This repository's dogfood
#     position is that its own gates run through the CLI under test.
#   * Upstream's "prefer basanos.tex, else the first *.tex" step is gone with it. That was a
#     named preference for one downstream repository's paper, living in a template every
#     consumer synced; tasks/paper.py replaced it with two conventional names -- main.tex,
#     then paper.tex -- and then alphabetical order. Re-deriving the filename here would
#     reintroduce exactly the duplication the task removed, so the artifact step globs for
#     whatever PDF the task produced instead.
#
# The `tex_present` guard is kept even though `rhiza-task paper` skips on its own: the task
# skipping is cheap, but installing the engine first is not. So the guard is about the
# install, not about the gate. It buys less than it did -- one pinned tarball where a TeX
# distribution was an apt-get and four packages -- and is kept because it costs nothing and
# still skips a download for a consumer with no paper.
#
# This note used to add "and this repository ships no docs/paper", which was the guard's
# original motivation and is no longer true: docs/paper/paper.tex arrived with the paper
# describing the package, so both `on.paths` filters above now match real files and this
# workflow runs rather than being dormant. The guard is kept anyway -- it is what makes the
# workflow safe to inherit for a consumer that ships no paper, which is still most of them.
#
# Workflow: Paper
# Purpose: Compile the LaTeX paper (docs/paper/*.tex) to a PDF, publish it as a workflow
#          artifact, and keep the latest PDF on the `paper` branch.

name: "(RHIZA) PAPER"

# The paths list has to name the *action* as well as the workflow, and that is not
# housekeeping: `.github/actions/setup-tectonic` is where the engine version, its checksum
# and the bundle cache live, so a change there decides whether this workflow works -- and
# without this entry, editing it triggers nothing. Two commits proved that in a row: the
# fix that pinned the cache path merged and ran no paper build at all, so the thing it
# fixed had to be checked by hand with `workflow_dispatch`. A path that can break a
# workflow belongs in that workflow's filter.
on:
  push:
    branches: [main]
    paths:
      - 'docs/paper/**'
      - '.github/workflows/rhiza_paper.yml'
      - '.github/actions/setup-tectonic/**'
  pull_request:
    paths:
      - 'docs/paper/**'
      - '.github/workflows/rhiza_paper.yml'
      - '.github/actions/setup-tectonic/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-pdf:
    name: compile the paper
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the compiled PDF to the paper branch

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect docs/paper/*.tex
        id: check_tex
        run: |
          if compgen -G "docs/paper/*.tex" > /dev/null 2>&1; then
            echo "tex_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "tex_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (no docs/paper/*.tex present)
        if: ${{ steps.check_tex.outputs.tex_present != 'true' }}
        run: echo "No docs/paper/*.tex found; skipping LaTeX compilation." >> "$GITHUB_STEP_SUMMARY"

      # The same action SHA and uv version as ci.yml, so the CLI runs under the resolver the
      # gates were tested with.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: ${{ steps.check_tex.outputs.tex_present == 'true' }}
        with:
          version: "0.11.16"
          enable-cache: true

      # The same engine as rhiza_book.yml, and not merely the same intent: that workflow
      # produces the copy of the PDF inside the book and this one the artifact and the `paper`
      # branch, so a version skew between them would show up as two different PDFs of one
      # document. The local action is where the version, the URL and the digest live, exactly
      # once -- see .github/actions/setup-tectonic/action.yml for why it is a pinned tarball
      # rather than a package or the upstream installer.
      - name: Set up tectonic
        if: ${{ steps.check_tex.outputs.tex_present == 'true' }}
        uses: ./.github/actions/setup-tectonic

      # `rhiza-task paper` guards on tectonic being present and on the paper folder
      # existing, chooses the root document, and runs tectonic over it -- which reruns the
      # TeX pass and bibtex until the references converge on its own, so there is no flag
      # here saying so. Everything this step used to spell out lives there.
      - name: Compile the paper
        if: ${{ steps.check_tex.outputs.tex_present == 'true' }}
        run: uv run rhiza-task paper

      - name: Locate the compiled PDF
        id: pdf
        if: ${{ steps.check_tex.outputs.tex_present == 'true' }}
        run: |
          pdf_path=$(find docs/paper -maxdepth 1 -name '*.pdf' | head -1)
          if [ -z "$pdf_path" ]; then
            echo "::error::rhiza-task paper produced no PDF under docs/paper"
            exit 1
          fi
          echo "pdf_path=${pdf_path}" >> "$GITHUB_OUTPUT"
          echo "pdf_file=$(basename "$pdf_path")" >> "$GITHUB_OUTPUT"

      - name: Upload the PDF artifact
        if: ${{ steps.check_tex.outputs.tex_present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pdf.outputs.pdf_file }}
          path: ${{ steps.pdf.outputs.pdf_path }}
          retention-days: 30

      # An orphan `paper` branch holding only the current PDF, so the latest build has a
      # stable URL that outlives the 30-day artifact retention.
      #
      # Built with plumbing rather than by checking the branch out, and that is the whole
      # point of the step's shape: **the workspace must survive it.** This used to run
      # `git checkout -b paper origin/paper`, which replaces the checked-out tree with a
      # branch holding one PDF -- and a *local* composite action's post phase re-reads its
      # definition from the workspace. So the job pushed the PDF and then died on:
      #
      #     Can't find 'action.yml' ... under '.github/actions/setup-tectonic'.
      #     Did you forget to run actions/checkout before running your local action?
      #
      # The cost was not only a red run: the post step that failed was the tectonic bundle
      # cache *save*, so the cache never populated and every run paid the cold fetch. The
      # PR build was green throughout, because this step is gated on `push` and a
      # `pull_request` run therefore never swapped the tree out.
      #
      # `hash-object`, `mktree` and `commit-tree` write the blob, the tree and the commit
      # straight into the object database and push the resulting SHA at the branch ref.
      # Nothing is checked out, no index is touched, and the same three commands handle the
      # branch existing and not existing -- the second case is just a commit with no parent,
      # which is what "orphan" means. A worktree would also keep the workspace, but the
      # orphan half of it needs `git worktree add --orphan`, i.e. git >= 2.42, and this
      # needs no version floor at all.
      - name: Push the PDF to the paper branch
        if: ${{ steps.check_tex.outputs.tex_present == 'true' && github.event_name == 'push' }}
        env:
          PDF_PATH: ${{ steps.pdf.outputs.pdf_path }}
          PDF_FILE: ${{ steps.pdf.outputs.pdf_file }}
          # commit-tree reads the identity from the environment, so there is no `git config`
          # here either -- that would be one more write to the checkout this step exists to
          # leave alone.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          blob=$(git hash-object -w "$PDF_PATH")
          tree=$(printf '100644 blob %s\t%s\n' "$blob" "$PDF_FILE" | git mktree)

          # Explicit refspec: `git fetch origin paper` alone relies on the remote's
          # configured refspec to populate the tracking ref, and actions/checkout narrows
          # that to the ref it checked out.
          git fetch --quiet origin '+refs/heads/paper:refs/remotes/origin/paper' 2>/dev/null || true

          if parent=$(git rev-parse --verify --quiet refs/remotes/origin/paper); then
            if [ "$(git rev-parse "${parent}^{tree}")" = "$tree" ]; then
              echo "paper branch already carries this PDF; nothing to push"
              exit 0
            fi
            commit=$(git commit-tree "$tree" -p "$parent" -m "Update $PDF_FILE [skip ci]")
          else
            commit=$(git commit-tree "$tree" -m "Update $PDF_FILE [skip ci]")
          fi

          git push origin "$commit:refs/heads/paper"

      # `paper-clean` ran nowhere at all until #152, and this is the only job in the
      # repository with a compiled paper to clean -- anywhere else it would pass by finding
      # nothing, which is the shape of a step that proves nothing.
      #
      # Last, and after the push, because it removes the **PDF as well as** the aux files:
      # `paper_clean` adds `.pdf` to AUX_SUFFIXES on the grounds that removing the output is
      # the point of a clean. So the two steps above have to have finished with it.
      #
      # Both assertions name what tectonic actually leaves, which is not what a TeX
      # distribution would: tectonic writes only the PDF plus, because `paper` passes
      # `--keep-logs`, the `.log`. There is no `.aux` here to look for, so asserting one was
      # gone would pass on a `paper-clean` that deleted nothing at all.
      - name: rhiza-task paper-clean
        if: ${{ steps.check_tex.outputs.tex_present == 'true' }}
        run: |
          uv run rhiza-task paper-clean
          test ! -e "${{ steps.pdf.outputs.pdf_path }}"
          test -z "$(find docs/paper -maxdepth 1 -name '*.log')"
