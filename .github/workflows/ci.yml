name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the gates only need to read the code.
permissions:
  contents: read

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Mirrors the Programming Language :: Python :: X.Y classifiers in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exact version, not a floating major: astral-sh/setup-uv publishes no `v8`, `v9` or
      # `v10` alias tag, so `@v10` fails to resolve at job start.
      #
      # This step is also what replaces `install-uv`. bootstrap.mk curls the uv installer
      # into ./bin because make cannot assume uv exists; a workflow can just say so.
      #
      # `version` pins the uv binary itself, not just the action, to the same uv that
      # rhiza_release.yml builds and publishes with. A gate that passes here on one uv and
      # a release built on another is a resolver difference nothing would catch -- which is
      # also why dependabot is not asked to move it. It is reviewed by hand; see the note
      # at the foot of .github/dependabot.yml.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Windows is in the matrix deliberately. The make layer needed a 40-line probe to
      # detect make falling back to cmd.exe, because its recipes were POSIX shell; every
      # command here is an argument vector, so this job is what asserts that the shell
      # dependency is really gone. It asserts it of the vectors; the step below asserts it
      # of an actual process.
      - name: Run tests
        run: uv run --group test --python ${{ matrix.python-version }} pytest -ra

      # Because no test in the suite runs a tool -- conftest.py patches all four of uv.py's
      # entry points and asserts on the vectors instead, which is why it finishes in under
      # two seconds -- the Windows and macOS legs never resolved a binary, spawned a
      # process, or compared a real path. The only end-to-end invocation anywhere was
      # `rhiza-task all` in the `gates` job below, on ubuntu. So the platform this package's
      # premise is aimed at was the one platform the CLI was never started on.
      #
      # This is deliberately a smoke step and not the gate suite: most gates provision a
      # toolchain and would triple the matrix for little signal, because the failure mode
      # being guarded against is "the CLI does not start, or cannot find its own tools, on
      # this OS". `list` executes config resolution, layer detection and the registry walk;
      # `doctor` then resolves binaries for real -- `shutil.which` (uv.exe on Windows), a
      # real subprocess, `cfg.root` path handling -- which is the layer the suite stubs.
      # Neither provisions anything, and `make` is optional in `doctor`'s TOOLS, so its
      # absence on the runners is reported rather than fatal.
      #
      # `!cancelled()` for the reason the ruff job's two halves have it: a broken CLI and a
      # failing test are independent findings, and reporting one at a time costs a round
      # trip per fix.
      #
      # `todos` is the third command for a reason `list` and `doctor` cannot cover between
      # them: both stop short of a task *body*. `list` walks the registry and `doctor`
      # resolves binaries, but neither enters a `run` -- so the layer where `cfg.root` path
      # handling, `Path.relative_to(...).as_posix()` and the guard evaluation compose into a
      # real invocation was still ubuntu-only, because `rhiza-task all` in the `gates` job
      # runs there and nowhere else.
      #
      # `todos` specifically because it provisions nothing: it reads the tree and prints.
      # That keeps this a smoke step rather than the gate suite, which is the same reason
      # the note above gives for not running the gates here -- most provision a toolchain
      # and would triple the matrix for little signal. `as_posix` in the task is what makes
      # its output identical on Windows, so a regression there shows up as a diff a reader
      # can see rather than a crash.
      - name: CLI smoke (the layer the suite stubs)
        if: ${{ !cancelled() }}
        run: |
          uv run --python ${{ matrix.python-version }} rhiza-task list
          uv run --python ${{ matrix.python-version }} rhiza-task doctor
          uv run --python ${{ matrix.python-version }} rhiza-task todos

  # ruff.toml is 9 KB of deliberate rule selection, and this job is not the only thing
  # enforcing it: `.pre-commit-config.yaml` carries the same ruff hooks, so `rhiza-task
  # fmt` -- and the dogfood `all` in the `gates` job below -- runs them too. It was the
  # only thing before that config existed, which is why the job was split out.
  #
  # Kept anyway, now for one reason rather than two: a red check named `ruff` says what
  # broke without opening a log, and this needs no venv, no sync and no matrix. The
  # duplicated work is the price of that, and it is cheap.
  #
  # `ruff@0.16.3` is pinned for the reason the uv pin above is -- a floating ruff means a
  # new release's new rules can turn a green PR red without a commit touching this repo.
  # Bumping it is then a deliberate commit that carries whatever fixes the new rules want,
  # in both places at once: .pre-commit-config.yaml pins the same version, and dependabot
  # moves neither, deliberately. See the note at the foot of .github/dependabot.yml.
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      # Both halves run even when the first fails: a formatting diff and a lint error are
      # independent findings, and reporting one at a time costs a round trip per fix.
      - name: ruff check
        run: uvx ruff@0.16.3 check --output-format=github .

      - name: ruff format --check
        if: ${{ !cancelled() }}
        run: uvx ruff@0.16.3 format --check --diff .

  # The gateable half of link checking. weekly.yml runs lychee over the network; this runs
  # it with `--offline`, which resolves only *local* targets -- relative links between the
  # eleven docs/ pages, and README's links into them.
  #
  # The split is about determinism, not thoroughness. An external 404 is somebody else's
  # deploy, so gating a pull request on it fails builds the author cannot fix, and a gate
  # that fails for unfixable reasons is one people learn to ignore. Offline checking cannot
  # do that: a relative link either resolves in the tree or does not, and if it does not,
  # the person who broke it is the person reading the failure.
  #
  # It is also the only thing checking docs/ cross-links at all. `rhiza-task docs-examples`
  # asks whether the *fences* parse and markdownlint asks whether the markdown is
  # well-formed; neither follows a link. Eleven files of prose linking to each other had
  # nothing asking whether the targets exist.
  links:
    name: local links in README and docs
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --verbose
            --no-progress
            README.md
            CONTRIBUTING.md
            'docs/**/*.md'
          fail: true

  gates:
    name: the gates this package applies to others
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      # Dogfooding, and not for its own sake: `all` is the aggregate consumers run, so a
      # break in prerequisite resolution or outcome reporting fails here first.
      #
      # What that covers is `fmt deps test docs-coverage security license typecheck
      # rhiza-test` -- the prerequisite list in tasks/python.py's `all`. Two things in the
      # registry are outside it, both on purpose, so that a reader can tell "skipped on
      # purpose" from "forgotten":
      #
      #   * `semgrep` is not an `all` prerequisite anywhere -- upstream rhiza runs it on
      #     the weekly cadence, not per PR, and this repository's weekly.yml records why
      #     that job is not lifted either: `rhiza-task semgrep` skips without
      #     .rhiza/semgrep.yml, and this repository ships none, exactly as pytest-rhiza
      #     does not. So there is nothing for CI to invoke until a rule file exists.
      #   * `fmt` is a prerequisite and *runs*, over the `.pre-commit-config.yaml` this
      #     repository now ships. It used to skip for want of that file, and this note used
      #     to say so; the file arrived in 00aaa44, so the dogfood run covers one more gate
      #     than it did. Its ruff hooks pin the same 0.16.3 the `lint` job above does,
      #     deliberately, so the two cannot report different findings.
      #
      # `semgrep` is why this still runs without --strict: --strict turns a skip into a
      # failure, and it is the right setting in a *consumer* repository, where a skip means
      # a gate lost its subject. Here one gate has no subject on purpose, so asserting it
      # would only assert that this repo is something it is not.
      - name: rhiza-task all
        run: uv run rhiza-task all

      # `complexity` is deliberately outside `all` -- tasks/python.py says why, in one line:
      # `all` is what every consumer's CI invokes, so adding a prerequisite to it would fail
      # builds in repositories that changed nothing. So this repository opts in by naming it
      # here, which is the mechanism a consumer would use too.
      #
      # It is what turns the ceiling in config.py's `__post_init__` note from discipline into
      # a gate. That note commits to a number -- C (15) -- and until this step nothing read
      # it back; `uvx radon cc src -a -s` was a command a human had to remember to run.
      #
      # The figure the gate compares against that ceiling is the worst *block* radon reports,
      # and radon's blocks include classes: the highest is currently the `Guard` class at
      # C (14), one above `Guard.check` and `Config.__post_init__` at C (13). So the headroom
      # is one, not the two settings' worth the `__post_init__` note's "roughly two more
      # settings" might suggest -- that sentence is about how many *settings* fit before the
      # flat form stops paying for itself, which is a different question from how much room
      # the gate has left. Worth stating which number this tracks, because the class figure
      # and the worst-function figure differ and only one of them fails the build.
      #
      # `!cancelled()` for the reason the ruff job's two halves have it: a complexity finding
      # and a gate failure are independent, and reporting one at a time costs a round trip.
      - name: rhiza-task complexity
        if: ${{ !cancelled() }}
        run: uv run rhiza-task complexity

      # `docs-examples` is outside `all` for the same semver reason `complexity` is, and named
      # here for the same reason: this is the mechanism a consumer would use to opt in.
      #
      # What it adds that no other gate here reaches: `docs-coverage` asks whether a docstring
      # exists and markdownlint asks whether the markdown is well-formed, so the question
      # "is what the documentation *claims* still true?" had one answer for `README.md` --
      # pytest-rhiza's `test_readme_validation`, via `rhiza-test` -- and none at all for
      # `docs/`, which holds the larger share of the fences and `getting_started.md` among
      # them. That is the newcomer's first contact, and a stale command there renders
      # perfectly right up to the moment it is run.
      #
      # `!cancelled()` for the reason the ruff job's two halves have it: a broken example and
      # a failing gate are independent findings, and reporting one at a time costs a round
      # trip per fix.
      - name: rhiza-task docs-examples
        if: ${{ !cancelled() }}
        run: uv run rhiza-task docs-examples

  # The Rust and Go layers are 165 statements at 100% coverage, and every one of those
  # statements is covered by an *argument-vector assertion*: conftest.py patches uv.py's four
  # entry points and the tests assert on what would have run. That is the point of the
  # package and not a shortcut -- but it means a vector that is well-formed and *wrong*, a
  # flag cargo rejects or a subcommand renamed upstream, passes every gate in this
  # repository and breaks in the first consumer that has the toolchain installed.
  #
  # `rhiza-task all` in the `gates` job covers the Python eight end-to-end. These two jobs
  # are the missing half, and they matter because "one set of task names across Python, Rust
  # and Go" is the package's headline claim -- the half with no end-to-end assertion was the
  # half being advertised.
  #
  # No toolchain action, deliberately: ubuntu-latest ships rustup, cargo, clippy and go
  # already, and what is under test is whether the vector is a command the real binary
  # accepts -- not whether it accepts it on one pinned version. A pin belongs here the day a
  # vector turns out to be version-sensitive, and not before; adding one now would be a
  # third place to bump for no signal.
  #
  # Scope is deliberately the tasks whose prerequisites provision nothing. `go:typecheck`
  # wants five `go install`s and `rust:test` wants cargo-binstall plus four cargo
  # subcommands; each would add minutes per run to assert one more vector. The failure mode
  # being guarded against is "the vector is not the command the tool accepts", and one real
  # invocation per tool catches it.
  # The Python counterpart of the two layer jobs below, and it exists for exactly the
  # argument their comment makes: this layer's coverage is argument-vector assertions, so a
  # vector that is well-formed and *wrong* passes every other gate here and breaks in the
  # first consumer that runs it. That argument was never Go- or Rust-specific -- the Python
  # layer simply had the *appearance* of coverage, because `gates` runs `rhiza-task all`
  # against this repository, which is one very unusual project: it is the package's own
  # source tree, with a manifest tuned to it.
  #
  # So: a throwaway project, the way go-layer and rust-layer use one, for the same reason
  # theirs lives in $RUNNER_TEMP rather than being committed here -- a second pyproject.toml
  # inside this repository would change what `detect_layers` and every path setting resolve.
  #
  # `test` is the task chosen because it is the one with the most vector to get wrong: it
  # pulls in `install` (so `uv lock --check` and `uv sync` both run for real) and then
  # invokes pytest with the coverage flags assembled from config. The scratch project sets no
  # folder settings, so what runs here is the *shipped defaults* -- which is precisely what a
  # consumer gets, and what this repository's own manifest overrides.
  python-layer:
    name: python tasks against a real toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      # Deliberately minimal: a real manifest, one module, one passing test. Anything more
      # would be testing the fixture. `coverage_fail_under = 0` because the subject is the
      # vector, not the fixture's coverage -- leaving the shipped default would fail this job
      # on a fixture detail and teach nothing about the vector.
      - name: Build a throwaway Python project
        run: |
          mkdir -p "$RUNNER_TEMP/pyproj/src/demo" "$RUNNER_TEMP/pyproj/tests"
          cd "$RUNNER_TEMP/pyproj"
          cat > pyproject.toml <<'EOF'
          [project]
          name = "demo"
          version = "0.1.0"
          requires-python = ">=3.11"

          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"

          [dependency-groups]
          test = ["pytest", "pytest-cov"]

          [tool.rhiza-task]
          coverage_fail_under = 0
          EOF
          printf 'def add(a, b):\n    "Add two numbers."\n    return a + b\n' > src/demo/__init__.py
          printf 'from demo import add\n\n\ndef test_add():\n    assert add(1, 2) == 3\n' > tests/test_demo.py

      # `--root` addresses the scratch project, as the two layer jobs do. A vector that uv or
      # pytest rejects fails here, which is the whole point: no stub can reject one.
      - name: rhiza-task test
        run: uv run rhiza-task test --root "$RUNNER_TEMP/pyproj"

  go-layer:
    name: go tasks against a real toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      # A throwaway module rather than a fixture committed here: it must live outside this
      # repository, because a go.mod inside it would make `detect_layers` report this
      # repository as a Go project and change what every other gate resolves.
      - name: Build a throwaway Go module
        run: |
          mkdir -p "$RUNNER_TEMP/gomod"
          cd "$RUNNER_TEMP/gomod"
          printf 'module example.com/demo\n\ngo 1.21\n' > go.mod
          printf 'package demo\n\n// Add returns the sum of a and b.\nfunc Add(a, b int) int {\n\treturn a + b\n}\n' > demo.go
          printf 'package demo\n\nimport "testing"\n\nfunc TestAdd(t *testing.T) {\n\tif Add(1, 2) != 3 {\n\t\tt.Fatal("Add is wrong")\n\t}\n}\n' > demo_test.go

      # `go:test` addresses the layer explicitly, which is the only way to reach a layer
      # `lookup` did not pick -- and here it also documents which of the three `test` tasks
      # is under test. It pulls in `go:install`, so this one command exercises `go mod
      # download`, the hook-install skip on a repo with no .pre-commit-config.yaml, and `go
      # test ./... -race -shuffle=on`.
      - name: rhiza-task go:test
        run: uv run rhiza-task go:test --root "$RUNNER_TEMP/gomod"

  rust-layer:
    name: cargo tasks against a real toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      # `cargo new` rather than hand-written files, so the fixture is whatever the installed
      # cargo considers a valid crate rather than whatever was true when this was written.
      # Outside the repository for the reason the Go job gives about go.mod.
      # Not `$RUNNER_TEMP/crate`: cargo takes the package name from the directory name and
      # rejects `crate`, which is a Rust keyword. Caught by running this for real rather than
      # by reading it.
      - name: Build a throwaway crate
        run: cargo new --lib "$RUNNER_TEMP/demo-crate"

      # `rust:typecheck` pulls in `rust:install`, and the interesting vector there is not
      # clippy: a fresh `cargo new` has no Cargo.lock, so `cargo fetch --locked` fails and
      # the unlocked fallback runs. That fallback is rust.mk's `|| $(CARGO) fetch`, carried
      # over rather than rediscovered, and this is the only place it executes for real.
      - name: rhiza-task rust:typecheck
        run: uv run rhiza-task rust:typecheck --root "$RUNNER_TEMP/demo-crate"

  # The three jobs above exist because a vector that is well-formed and *wrong* passes every
  # other gate here and breaks in the first consumer that runs it. That argument was never
  # specific to the language layers, and cross-referencing every `rhiza-task <task>` in
  # .github/ against the registry showed where else it applied: docker, presentation, marimo,
  # lfs and the GitHub helpers -- around eighteen shipped vectors -- had no real execution
  # anywhere, in the families a consumer reaches for after the core gates. This job is that
  # gap closed. `bundle` is the suite's own word for them, from tests/test_bundle_tasks.py.
  #
  # One job rather than five, unlike the language layers: those are separate because each
  # needs a different toolchain installed, whereas docker, node, git-lfs and gh are all
  # preinstalled on ubuntu-latest, so five jobs would be five checkouts to say the same thing.
  #
  # Four vectors are deliberately *not* here, and the reason is structural rather than
  # effort -- each one blocks forever by design, so a job running it would hang until the
  # timeout rather than report anything:
  #
  #   docker-run           `docker run --rm -it`, an interactive terminal
  #   presentation-serve   Marp's watching preview server
  #   marimo               the Marimo editor, a headless server with no exit
  #   book/serve           `python -m http.server`, already covered by rhiza_book.yml
  #
  # `presentation-pdf` is left out for a different and weaker reason: Marp renders PDF
  # through headless Chrome, so the step would download a browser on every run. Its vector
  # differs from `presentation`'s only by `--allow-local-files`, which is asserted in the
  # suite. If it ever earns a real run, that is the trade to revisit.
  #
  # `lfs-pull` is left out because it needs a remote holding LFS objects; the fixture has no
  # remote at all, and inventing one would test the fixture.
  bundle-layer:
    name: bundle tasks against a real toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The GitHub helpers are read-only queries, and each needs the scope for what it reads:
      # `view-prs` pull-requests, `view-issues` issues, and `failed-workflows` and
      # `workflow-status` the Actions API. GITHUB_TOKEN grants none of these from the
      # workflow-level `contents: read`, so a missing line here is a 403 rather than a skip.
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      # One fixture for the four families that need a project, built to the shapes the tasks'
      # guards actually look for: docker/Dockerfile, PRESENTATION.md, docs/notebooks/*.py, and
      # a git repository for git-lfs to configure. `coverage_fail_under = 0` for the reason
      # python-layer gives -- the subject is the vector, not the fixture's coverage.
      - name: Build a throwaway project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle/docker" "$RUNNER_TEMP/bundle/docs/notebooks" \
                   "$RUNNER_TEMP/bundle/src/demo"
          cd "$RUNNER_TEMP/bundle"
          # src/demo exists because `marimo-validate` names `install` as a prerequisite, and
          # `uv sync` builds the project: a manifest declaring hatchling with nothing for it to
          # package fails the build, which blocks the task before its vector is ever reached.
          # The other four families have no prerequisite and would not have noticed. Found by
          # running this job's steps for real, which is the same way rust-layer learned that
          # `cargo new crate` is rejected.
          printf '"""A package for hatchling to build."""\n' > src/demo/__init__.py
          cat > pyproject.toml <<'EOF'
          [project]
          name = "demo"
          version = "0.1.0"
          requires-python = ">=3.11"

          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"

          [tool.rhiza-task]
          coverage_fail_under = 0
          EOF
          # `ARG PYTHON_VERSION` on purpose: docker-build passes --build-arg whatever the
          # layer, and a Dockerfile declaring no such ARG gets a warning. Declaring it is what
          # asserts the flag is actually consumed rather than merely tolerated.
          cat > docker/Dockerfile <<'EOF'
          ARG PYTHON_VERSION=3.11
          FROM alpine:3.22
          RUN echo "built for python ${PYTHON_VERSION}"
          EOF
          # Marp needs front matter to treat the file as a deck rather than plain markdown.
          cat > PRESENTATION.md <<'EOF'
          ---
          marp: true
          ---

          # Slide one

          ---

          # Slide two
          EOF
          # marimo-validate runs each notebook as a plain script and reads
          # NOTEBOOK_OUTPUT_FOLDER, so a script that writes there is the smallest fixture that
          # exercises the env-var half of the vector rather than just the exit status.
          cat > docs/notebooks/demo.py <<'EOF'
          import os
          import pathlib

          out = pathlib.Path(os.environ["NOTEBOOK_OUTPUT_FOLDER"])
          out.mkdir(parents=True, exist_ok=True)
          (out / "ran.txt").write_text("ok\n")
          print("notebook ran")
          EOF
          git init --quiet .
          git config user.email ci@example.com
          git config user.name CI

      # buildx with --load, against a real daemon. The vector's failure mode is a flag docker
      # stopped accepting, which no stub can reject.
      - name: rhiza-task docker-build
        run: uv run rhiza-task docker-build --root "$RUNNER_TEMP/bundle"

      # Immediately after, so the image it removes is one this run built. `docker rmi` is
      # `check=False` in the task -- removing an image that was never built is the expected
      # state of a clean target -- so this asserts the vector parses, not that it found work.
      - name: rhiza-task docker-clean
        run: uv run rhiza-task docker-clean --root "$RUNNER_TEMP/bundle"

      # Resolves through the npx branch of marp_argv, which is the one a consumer without a
      # global marp hits. The first real exercise of cfg.marp_package.
      - name: rhiza-task presentation
        run: uv run rhiza-task presentation --root "$RUNNER_TEMP/bundle"

      - name: rhiza-task marimo-validate
        run: uv run rhiza-task marimo-validate --root "$RUNNER_TEMP/bundle"

      # git-lfs is preinstalled on ubuntu-latest. `lfs-install` is the one task in that module
      # that raises Failed rather than Skip on a missing binary, so an image that dropped
      # git-lfs would fail here loudly instead of skipping quietly -- which is the correct
      # outcome and worth having somewhere.
      - name: rhiza-task lfs-install, lfs-track, lfs-status
        run: |
          uv run rhiza-task lfs-install --root "$RUNNER_TEMP/bundle"
          uv run rhiza-task lfs-track --root "$RUNNER_TEMP/bundle"
          uv run rhiza-task lfs-status --root "$RUNNER_TEMP/bundle"

      # Against the checkout, not the fixture: every one of these resolves the repository from
      # the git remote, so a throwaway directory with no remote would test nothing. All are
      # read-only queries.
      #
      # `whoami` runs `gh auth status --json hosts --template ...`, and `--json` on that
      # subcommand is recent enough that this job is the only thing asserting the installed gh
      # still has it.
      - name: rhiza-task github helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run rhiza-task whoami
          uv run rhiza-task view-prs
          uv run rhiza-task view-issues
          uv run rhiza-task failed-workflows
          uv run rhiza-task workflow-status
          uv run rhiza-task latest-release

  # bundle-layer's argument, carried to the one family it stopped short of. Cross-referencing
  # `rhiza-task list` against every `rhiza-task <task>` in .github/ showed the Testing extras
  # bundle -- benchmark, stress and hypothesis-test -- was the remaining set with no real
  # execution: all three ran nowhere at all.
  #
  # They are the sharpest case for this kind of job rather than the mildest, because
  # `benchmark` is the only vector in the package that pins the tools it provisions -- see its
  # `withs=` tuple in src/rhiza_task/tasks/extras.py, which is deliberately not transcribed
  # here: this comment sits beside the step and not beside the pin, so a copy would go stale
  # on the next bump with nothing reading it back.
  #
  # Those pins exist in exactly one place -- the vector -- and are exact on purpose, since
  # benchmark numbers only compare within a tool version. Nothing else installs them, so a
  # yank or a release that stops importing on a newer Python is well-formed and *wrong*: it
  # passes fmt, typecheck, test, complexity and the 100 floor, and breaks in the first
  # consumer with a benchmarks folder. `--benchmark-histogram` is the flag that needs pygal,
  # and this job is what asserts pygal alone is enough for it -- pytest-benchmark documents
  # an extra that also pulls pygaljs, and the vector deliberately does not.
  #
  # A separate job rather than three more steps on python-layer, whose fixture comment says
  # "anything more would be testing the fixture" and is right: these three need a benchmarks
  # folder, a stress folder, marker registrations and a property test, which is four
  # additions to a fixture whose point is that it has none.
  extras-layer:
    name: testing-extras tasks against a real toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      # Built to the shapes the three guards look for: benchmarks/*.py, stress/*.py and
      # test_*.py under the tests folder. `coverage_fail_under = 0` for the reason
      # python-layer gives -- the subject is the vector, not the fixture's coverage.
      - name: Build a throwaway project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/extras/src/demo" "$RUNNER_TEMP/extras/tests/benchmarks" \
                   "$RUNNER_TEMP/extras/tests/stress"
          cd "$RUNNER_TEMP/extras"
          printf '"""A package for hatchling to build."""\n\n\ndef add(a, b):\n    """Add."""\n    return a + b\n' \
            > src/demo/__init__.py
          # hypothesis is declared as a project dependency and *not* left to the task's own
          # `--with`, which is the one thing running these steps for real taught. `stress`
          # provisions only pytest and pytest-html, and pytest imports every test module
          # during collection -- before `-m stress` deselects any of them -- so a property
          # test importing hypothesis breaks collection for a gate that never wanted to run
          # it. A real project with property tests declares hypothesis; the fixture has to
          # as well, or it tests the fixture's omission instead of the vector.
          #
          # The markers are registered for the same reason: unregistered `stress` and
          # `property` are warnings today, and PytestUnknownMarkWarning is the kind of thing
          # a future pytest promotes to an error.
          cat > pyproject.toml <<'EOF'
          [project]
          name = "demo"
          version = "0.1.0"
          requires-python = ">=3.11"

          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"

          [dependency-groups]
          test = ["pytest", "hypothesis"]

          [tool.rhiza-task]
          coverage_fail_under = 0

          [tool.pytest.ini_options]
          markers = ["stress: load and soak tests", "property: property-based tests"]
          EOF
          # One real benchmark, using pytest-benchmark's own fixture: `--benchmark-only`
          # deselects everything else, so a fixture without this collects nothing and pytest
          # exits 5, which the task reports as a failure rather than the skip it looks like.
          printf 'from demo import add\n\n\ndef test_add_benchmark(benchmark):\n    assert benchmark(add, 1, 2) == 3\n' \
            > tests/benchmarks/test_bench.py
          printf 'import pytest\n\nfrom demo import add\n\n\n@pytest.mark.stress\ndef test_add_under_load():\n    assert all(add(i, 0) == i for i in range(10000))\n' \
            > tests/stress/test_load.py
          # `@given` is what hypothesis's own plugin marks, which is what the task's
          # `-m "hypothesis or property"` selects -- so this asserts the marker expression,
          # not just that pytest starts.
          printf 'from hypothesis import given\nfrom hypothesis import strategies as st\n\nfrom demo import add\n\n\n@given(st.integers(), st.integers())\ndef test_add_commutes(a, b):\n    assert add(a, b) == add(b, a)\n' \
            > tests/test_props.py

      # Each asserts a different half of its vector: benchmark the two pins and the histogram
      # flag, stress the marker selection and the pytest-html provision, hypothesis-test the
      # `--ignore` of the benchmarks folder and the statistics and seed flags. All three run
      # `install` first, so `uv lock --check` and `uv sync` are exercised against the fixture.
      - name: rhiza-task benchmark
        run: uv run rhiza-task benchmark --root "$RUNNER_TEMP/extras"

      - name: rhiza-task stress
        run: uv run rhiza-task stress --root "$RUNNER_TEMP/extras"

      - name: rhiza-task hypothesis-test
        run: uv run rhiza-task hypothesis-test --root "$RUNNER_TEMP/extras"

  # The floors in pyproject.toml -- typer>=0.15, rich>=13.0, python-dotenv>=1.0 -- are a
  # claim, and `--frozen` everywhere else means nothing tests it: the lockfile resolves
  # typer 0.27.1 and rich 15.0.0, nine and two minor versions above what the manifest
  # says is enough. This job is the only place those numbers are asserted. Lifted from
  # rhiza's rhiza_ci.yml `lowest-deps`, which is the one job there that calls plain uv
  # rather than a pinned older rhiza-task, so it carries no circular dependency on this
  # package.
  lowest-deps:
    name: lowest-direct dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          enable-cache: true

      # Deliberately not --frozen: resolving against the manifest rather than the
      # lockfile is the whole point.
      - name: Resolve the declared floors
        run: uv sync --all-extras --all-groups --resolution lowest-direct

      - name: Show what that resolved to
        run: uv pip list

      # pytest directly rather than `rhiza-task test`: the task provisions pytest through
      # `uv run --with`, which resolves newest and would silently undo the floors this job
      # exists to check.
      - name: Run tests against the floors
        run: uv run --all-extras --all-groups --resolution lowest-direct pytest -ra
